# this_file: src_docs/mkdocs.yml
site_name: GetGo Fonts for FontLab
site_url: https://fontlabcom.github.io/getgo-fonts/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january-remote
  font: false
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - fly
extra:
  fly:
    chrome: fontlab
    chrome_options:
      site-label: GetGo Fonts
      sticky: true
    hue: cherry
    links: accent
    fonts:
      sources:
        - typekit:gav0zux
        - typekit:cmv5add
        - google:Outfit:wght@100..900
      roles:
        body: {family: "'Outfit', system-ui, sans-serif"}
        em: {style: italic}
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - css/site.css
  - css/fonts.css
